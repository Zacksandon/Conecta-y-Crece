<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Conecta & Crece</title>
    <link rel="stylesheet" href="../css/contacto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
    <nav class="navbar">
        <div class="logo">
            <h1>Conecta & Crece</h1>
            <div class="logo-glow"></div>
        </div>
        <div class="orb-menu-toggle"><i class="fas fa-globe"></i></div>
        <div class="orb-menu">
            <ul class="orb-items">
                <li><a href="../html/index.html">Inicio</a></li>
                <li><a href="../html/perfil.html">Perfil</a></li>
                <li><a href="../html/comunidad.html">Comunidad</a></li>
                <li><a href="../html/proyectos.html">Proyectos</a></li>
                <li><a href="../html/historias.html">Historias</a></li>
                <li><a href="../html/eventos.html">Eventos</a></li>
                <li><a href="../html/recursos.html">Recursos</a></li>
                <li><a href="../html/nosotros.html">Nosotros</a></li>
                <li><a href="../html/contacto.html">Contacto</a></li>
                <li><a href="#" id="logout" style="display: none;">Cerrar Sesión</a>
            </ul>
        </div>
        <div class="user-status" id="user-status"></div>
        <div class="nav-buttons" style="display: flex;">
            <a href="../html/registro.html" class="btn-registrarse">Registrarse</a>
            <a href="../html/login.html" class="btn-iniciar">Iniciar Sesión</a>
        </div>
    </nav>
</header>

    <main>
        <section class="contacto">
            <h1 class="titulo-neon">Contáctanos</h1>
            <p class="subtitulo-neon">Estamos aquí para ayudarte. ¡Escríbenos!</p>
            <form id="contact-form">
                <div class="form-group">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" required placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" required placeholder="tu@email.com">
                </div>
                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" rows="4" required placeholder="Tu mensaje"></textarea>
                </div>
                <button type="submit" class="btn-enviar">Enviar</button>
            </form>
            <div id="contact-message" class="contact-message"></div>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="../../js/contacto.js"></script>
    <script src="../../js/auth.js"></script>
</body>
</html>
