<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Conecta & Crece</title>
    <link rel="stylesheet" href="../css/login-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>Conecta & Crece</h1>
            </div>
        </nav>
    </header>

    <main>
        <div class="login-container">
            <h1 class="titulo-neon">CONECTA Y CRECE</h1>
            <div class="neon-sign">INICIAR SESIÓN</div>
            <form id="loginForm">
                <div class="form-group">
                    <input type="email" id="email" name="correo" placeholder="Correo" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <p class="register-link">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            <div id="message" style="color: #00BFFF; margin-top: 10px;"></div>
        </div>
    </main>

    <footer>
        <p>© 2025 Conecta & Crece. Todos los derechos reservados.</p>
        <div class="redes-sociales">
            <a href="#" class="icono"><i class="fab fa-facebook-f"></i></a>
            <a href="#" class="icono"><i class="fab fa-instagram"></i></a>
            <a href="#" class="icono"><i class="fab fa-linkedin-in"></i></a>
        </div>
    </footer>

    <script>
        const loginForm = document.getElementById('loginForm');
        const message = document.getElementById('message');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('http://localhost:5000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ correo: email, password: password })
                });

                if (!response.ok) {
                    throw new Error('Respuesta no exitosa: ' + response.status);
                }

                const result = await response.json();
                console.log('Respuesta de la API:', result);

                if (result.message === 'Inicio de sesión exitoso') {
                    const user = result.usuario;
                    localStorage.setItem('user', JSON.stringify(user));
                    message.textContent = result.message;
                    message.style.color = '#00BFFF';
                    setTimeout(() => {
                        if (result.redirect) {
                            window.location.href = result.redirect;
                        } else {
                            window.location.href = 'perfil.html';
                        }
                    }, 1000);
                } else {
                    message.textContent = result.error || 'Error en el inicio de sesión';
                    message.style.color = '#FF3B9E';
                }
            } catch (error) {
                message.textContent = 'Error de conexión con el servidor: ' + error.message;
                message.style.color = '#FF3B9E';
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
