<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Conecta & Crece</title>
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>Conecta & Crece</h1>
                <div class="logo-glow"></div>
            </div>
            <div class="orb-menu-toggle"><i class="fas fa-globe"></i></div>
            <div class="orb-menu">
                <ul class="orb-items">
                    <li><a href="../html/index.html">Inicio</a></li>
                    <li><a href="../html/perfil.html">Perfil</a></li>
                    <li><a href="../html/comunidad.html">Comunidad</a></li>
                    <li><a href="../html/proyectos.html">Proyectos</a></li>
                    <li><a href="../html/historias.html">Historias</a></li>
                    <li><a href="../html/eventos.html">Eventos</a></li>
                    <li><a href="../html/recursos.html">Recursos</a></li>
                    <li><a href="../html/nosotros.html">Nosotros</a></li>
                    <li><a href="../html/contacto.html">Contacto</a></li>
                    <li><a href="#" id="logout">Cerrar Sesión</a></li>
                </ul>
            </div>
            <div class="user-status" id="user-status"></div>
            <div class="nav-buttons" style="display: none;">
                <a href="../html/registro.html" class="btn-registrarse">Registrarse</a>
                <a href="../html/login.html" class="btn-iniciar">Iniciar Sesión</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1 class="titulo-neon">Bienvenido a tu Perfil</h1>
                <p class="subtitulo-neon" id="user-info-display">Cargando...</p>
                <div id="rol-content" class="rol-content"></div>
            </div>
            <div class="profile-container">
                <div class="profile-form" id="profile-form">
                    <h2 class="form-title">Actualiza tu Perfil</h2>
                    <form id="updateForm">
                        <div class="form-group">
                            <label for="nombre">Nombre</label>
                            <input type="text" id="nombre" required placeholder="Tu nombre">
                        </div>
                        <div class="form-group">
                            <label for="apellido">Apellido</label>
                            <input type="text" id="apellido" required placeholder="Tu apellido">
                        </div>
                        <div class="form-group">
                            <label for="correo">Correo</label>
                            <input type="email" id="correo" required placeholder="tu@email.com">
                        </div>
                        <div class="form-group">
                            <label for="ubicacion">Ubicación</label>
                            <input type="text" id="ubicacion" required placeholder="Tu ciudad">
                        </div>
                        <div class="form-group">
                            <label for="bio">Biografía</label>
                            <textarea id="bio" rows="4" required placeholder="Cuéntanos sobre ti"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="habilidades">Habilidades</label>
                            <input type="text" id="habilidades" required placeholder="Ej: Programación, Marketing">
                        </div>
                        <div class="form-group">
                            <label for="experiencia">Experiencia (años)</label>
                            <input type="number" id="experiencia" min="0" required placeholder="0">
                        </div>
                        <div class="form-group">
                            <label for="intereses">Intereses</label>
                            <input type="text" id="intereses" required placeholder="Ej: Tecnología, Emprendimiento">
                        </div>
                        <div class="form-group">
                            <button type="submit" class="btn-submit">Guardar Cambios</button>
                        </div>
                    </form>
                    <div id="update-message" class="update-message"></div>
                </div>
            </div>
            <canvas class="particle-canvas"></canvas>
        </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="/js/perfil.js"></script>
</body>
</html>
