<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Conecta & Crece</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- jsPDF + autoTable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">
        <h1>Conecta & Crece</h1>
      </div>
      <ul class="nav-links">
        <li><a href="../html/index.html">Inicio</a></li>
        <li id="user-info"></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="admin-container">
      <h1 class="titulo-neon">Panel de Administración</h1>

      <!-- BOTÓN PDF -->
      <button id="downloadPDF" class="download-btn">
        <i class="fas fa-file-pdf"></i> Descargar Informe PDF
      </button>

      <div id="reportes"></div>
    </div>
  </main>

  <footer>
    <p>© 2025 Conecta & Crece. Todos los derechos reservados.</p>
    <div class="redes-sociales">
      <a href="#" class="icono"><i class="fab fa-facebook-f"></i></a>
      <a href="#" class="icono"><i class="fab fa-instagram"></i></a>
      <a href="#" class="icono"><i class="fab fa-linkedin-in"></i></a>
    </div>
  </footer>

  <!-- SCRIPTS -->
  <script src="../../js/auth.js"></script>
  <script>
    const reportesDiv = document.getElementById('reportes');
    const userInfo = document.getElementById('user-info');
    let usuariosData = [];

    // === VERIFICAR SESIÓN + MOSTRAR USUARIO ===
    document.addEventListener('DOMContentLoaded', () => {
      const sesion = verificarSesion();
      if (!sesion) return;

      const { user } = sesion;
      if (user.rol !== 'admin') {
        alert('Acceso denegado');
        window.location.href = '../html/perfil.html';
        return;
      }

      // MOSTRAR USUARIO EN NAVBAR
      const foto = user.foto_url || '../assets/default-avatar.png';
      userInfo.innerHTML = `
        <div class="user-info">
          <img src="${foto}" alt="Foto" class="user-avatar">
          <span class="user-name">${user.nombre} ${user.apellido}</span>
          <button id="logout-btn" class="btn-logout">Salir</button>
        </div>
      `;

      document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = '../html/login.html';
      });

      loadReportes(); // Cargar reportes solo si es admin
    });

    // === CARGAR REPORTES ===
    async function loadReportes() {
      try {
        const response = await fetch('http://localhost:5000/admin/reportes', {
          method: 'GET',
          headers: { 'Authorization': 'Bearer admin123' }
        });

        if (!response.ok) throw new Error('Error: ' + response.status);

        const result = await response.json();
        if (result.reportes) {
          usuariosData = result.reportes;
          let html = '<h2 class="neon-subtext">Reportes de Usuarios</h2><ul>';
          result.reportes.forEach(user => {
            html += `
              <li class="user-report">
                <span><b>Nombre:</b> ${user.nombre} ${user.apellido} (${user.rol})</span>
                <span><b>Correo:</b> ${user.correo}</span>
                <span><b>Ubicación:</b> ${user.ubicacion || 'N/A'}</span>
                <span><b>Bio:</b> ${user.bio || 'Sin bio'}</span>
                <span><b>Habilidades:</b> ${user.habilidades || 'N/A'}</span>
                <button class="delete-btn" data-id="${user.id}">Eliminar</button>
              </li>
            `;
          });
          html += '</ul>';
          reportesDiv.innerHTML = html;

          // === ELIMINAR USUARIO ===
          document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const userId = btn.dataset.id;
              const userName = btn.parentElement.querySelector('span').textContent;
              if (!confirm(`¿Eliminar a ${userName}?`)) return;

              const delRes = await fetch(`http://localhost:5000/admin/eliminar/${userId}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer admin123' }
              });

              if (delRes.ok) {
                btn.parentElement.remove();
                usuariosData = usuariosData.filter(u => u.id != userId);
                alert('Usuario eliminado');
              } else {
                alert('Error al eliminar');
              }
            });
          });
        } else {
          reportesDiv.innerHTML = '<p class="neon-subtext">No hay usuarios registrados</p>';
        }
      } catch (error) {
        reportesDiv.innerHTML = `<p class="neon-subtext">Error: ${error.message}</p>`;
      }
    }

    // === GENERAR PDF ===
    document.getElementById("downloadPDF").addEventListener("click", () => {
      if (usuariosData.length === 0) {
        alert("No hay datos para generar el PDF.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'pt', 'a4');

      doc.setFontSize(20);
      doc.setTextColor(255, 102, 0);
      doc.text("Informe de Usuarios - Conecta & Crece", 40, 50);

      doc.setFontSize(12);
      doc.setTextColor(100);
      doc.text(`Generado el ${new Date().toLocaleDateString()}`, 40, 70);

      const tableData = usuariosData.map(u => [
        u.id,
        `${u.nombre} ${u.apellido}`,
        u.correo,
        u.rol,
        u.ubicacion || 'N/A',
        u.bio || '',
        u.habilidades || ''
      ]);

      doc.autoTable({
        startY: 90,
        head: [['ID', 'Nombre', 'Correo', 'Rol', 'Ubicación', 'Bio', 'Habilidades']],
        body: tableData,
        styles: { fontSize: 9, cellPadding: 5 },
        headStyles: { fillColor: [255, 102, 0], textColor: 255 },
        alternateRowStyles: { fillColor: [245, 245, 245] },
        margin: { left: 40, right: 40 }
      });

      doc.save(`informe_conecta_crece_${Date.now()}.pdf`);
    });
  </script>
</body>
</html>
