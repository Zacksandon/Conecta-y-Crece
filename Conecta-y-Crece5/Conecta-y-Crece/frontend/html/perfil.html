<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Conecta & Crece</title>
    <link rel="stylesheet" href="../css/perfil.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>Conecta & Crece</h1>
            </div>
            <div class="orb-menu-toggle"><i class="fas fa-globe"></i></div>
            <div class="orb-menu">
                <ul class="orb-items">
                    <li><a href="../html/perfil.html">Perfil</a></li>
                    <li><a href="../html/comunidad.html">Comunidad</a></li>
                    <li><a href="../html/proyectos.html">Proyectos</a></li>
                    <li><a href="../html/historias.html">Historias</a></li>
                    <li><a href="../html/eventos.html">Eventos</a></li>
                    <li><a href="../html/recursos.html">Recursos</a></li>
                    <li><a href="../html/nosotros.html">Nosotros</a></li>
                    <li><a href="../html/contacto.html">Contacto</a></li>
                    <li><a href="#" id="logout" style="display: none;">Cerrar Sesión</a>
                </ul>
            </div>
            <div class="user-status" id="user-status"></div>
            <div class="nav-buttons" style="display: flex;">
                <a href="../html/login.html" class="btn-login">Iniciar Sesión</a>
                <a href="../html/registro.html" class="btn-registro">Registrarse</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="perfil-container">
            <!-- FOTO + ORB MENU -->
            <div class="foto-orb-section">
                <div class="foto-container">
                    <img id="foto-preview" src="../assets/default-avatar.png" alt="Foto de perfil">
                    <label for="foto-input" class="btn-foto">Cambiar Foto</label>
                    <input type="file" id="foto-input" accept="image/*" style="display: none;">
                </div>
            </div>

            <!-- FORMULARIO -->
            <div class="form-perfil-section">
                <h1 class="titulo-neon">Actualiza tu Perfil</h1>
                <form id="updateForm">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" id="apellido" required>
                    </div>
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" id="correo" disabled>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" id="ubicacion">
                    </div>
                    <div class="form-group">
                        <label>Biografía</label>
                        <textarea id="bio" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Habilidades</label>
                        <input type="text" id="habilidades" placeholder="Ej: Python, Diseño, Marketing">
                    </div>
                    <div class="form-group">
                        <label>Experiencia (años)</label>
                        <input type="number" id="experiencia" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label>Intereses</label>
                        <input type="text" id="intereses" placeholder="Ej: Tecnología, Emprendimiento">
                    </div>
                    <button type="submit" class="btn-guardar">GUARDAR CAMBIOS</button>
                </form>
                <p id="update-message" style="margin-top: 10px; font-weight: bold;"></p>
            </div>

            <div class="rol-content" id="rol-content">
                <p>Cargando tu rol...</p>
            </div>
        </div>
    </main>

    <canvas class="particle-canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="../../js/auth.js"></script>
    <script src="../../js/perfil.js"></script>
</body>
</html>
